name: ci

# Lint and test on every PR into main, and again after each merge.
# The data-logger branch is never built: it only holds the hourly CSV.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

# A new push to the same PR cancels the run that is now out of date.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Pytest
        run: pytest

  # Applies backend/migrations in order to a throwaway PostGIS database, then
  # checks the RLS policies role by role. Supabase itself is never touched.
  migrations:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: acdos_ci
    steps:
      - uses: actions/checkout@v7

      - name: Install psql if the runner lacks it
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      # The image pre-installs PostGIS and its add-ons into its default
      # database. A database made from template0 starts clean, like Supabase.
      - name: Create a clean database
        run: createdb --maintenance-db=postgres -T template0 acdos_ci

      - name: Supabase stand-ins (auth schema, roles)
        run: psql -v ON_ERROR_STOP=1 -q -f backend/tests/sql/supabase_stubs.sql

      - name: Apply migrations in order
        run: |
          for f in backend/migrations/*.sql; do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: PostGIS is in extensions, nothing of it left in public
        run: |
          test "$(psql -tAc "select extnamespace::regnamespace from pg_extension where extname = 'postgis'")" = extensions
          test "$(psql -tAc "select count(*) from pg_class where relnamespace = 'public'::regnamespace and relname = 'spatial_ref_sys'")" = 0

      - name: RLS smoke test
        run: psql -v ON_ERROR_STOP=1 -q -f backend/tests/sql/rls_smoke_test.sql

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android-client
    env:
      KTLINT_VERSION: "1.8.0"
    steps:
      - uses: actions/checkout@v7

      # JDK 25 matches gradle/gradle-daemon-jvm.properties, so Gradle does not
      # have to download its own toolchain on every run.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@v6

      # Standalone ktlint CLI, pinned, so no extra Gradle plugin is needed.
      # Style rules come from android-client/.editorconfig.
      - name: Ktlint
        run: |
          curl -sSLo ktlint "https://github.com/pinterest/ktlint/releases/download/${KTLINT_VERSION}/ktlint"
          chmod +x ktlint
          ./ktlint "app/src/**/*.kt" "*.kts" "app/*.kts"

      # gradlew is stored without the execute bit, so call it through bash.
      - name: Build, unit test and Android lint
        run: bash ./gradlew assembleDebug testDebugUnitTest lintDebug
